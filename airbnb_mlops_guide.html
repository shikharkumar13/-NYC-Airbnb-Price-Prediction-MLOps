## Chapter 10 — Orchestration with Prefect

### What Problem This Solves

Retraining currently means a person running `python track_experiments.py`, then `python registry.py`, in the right order — and remembering to do it at all. Real models go stale as new data arrives. We want the whole pipeline to run **by itself, on a schedule**; to **retry** steps that fail for temporary reasons; and to leave a **record** of every run we can inspect later.

**Prefect** is an *orchestrator*. You mark Python functions as **tasks**, combine them into a **flow**, and Prefect adds retries, logging, run history and scheduling. The **Prefect server** stores that history and shows it in a dashboard.

💡 **Why Prefect?** It's plain Python (decorators, no separate DSL), runs locally with one command, and its concepts — tasks, flows, retries, schedules — are the same ones you'd meet in Airflow or Dagster.

### Concepts Before Any Code

| Term | Meaning |
|---|---|
| **Task** | A function decorated with `@task` — one step, with optional retries |
| **Flow** | A function decorated with `@flow` that calls tasks; one execution is a **flow run** |
| **Retries** | `@task(retries=2, retry_delay_seconds=5)` — on failure, try again (twice, 5 s apart) |
| **Deployment** | A named, schedulable version of a flow |
| **Cron** | A schedule written as five fields: `minute hour day month weekday`. `0 3 * * 1` = Mondays at 03:00 |

```mermaid
flowchart LR
    subgraph flow ["Flow: airbnb-price-training"]
        L["load_data\n(retries=2)"] --> S["split_data"]
        S --> T["train_and_log ×5"]
        T --> P["promote_best_model\n≤100 MB, lowest RMSE"]
        P --> D["request_deploy\n(GitHub — Chapter 12)"]
    end
    SCH["⏰ Mondays 03:00 UTC"] --> flow
    flow -- "runs, models" --> MLF["MLflow :5001"]
    flow -- "states, logs" --> PF["Prefect :4200"]
```

### What Changes in This Chapter

| File | Change |
|---|---|
| `scripts/trigger_deploy.py` | New — asks GitHub to start a deployment (used for real in Chapter 12) |
| `tests/test_trigger_deploy.py` | New — 4 tests with a fake HTTP call |
| `orchestrate_training.py` | New — the flow |

### Step 1 — `scripts/trigger_deploy.py`: the hand-off to deployment

The last step of the flow asks **GitHub Actions** to build and publish a new image (Chapter 12). GitHub has an API for "run this workflow now":

📄 **File: `scripts/trigger_deploy.py`**

```python
"""Ask GitHub Actions to run deploy.yml (workflow_dispatch) for a promoted model version.

Needs a GitHub token with Actions: write on the repo (fine-grained PAT).
Usage: GITHUB_REPO=owner/repo GITHUB_TOKEN=... python -m scripts.trigger_deploy --model-version 3
"""
import argparse
import os
import sys

import requests

WORKFLOW_FILE = "deploy.yml"


class DeployTriggerError(RuntimeError):
    """GitHub refused to start the deploy workflow."""


def trigger_deploy(model_version: str, repo: str, token: str, ref: str = "main") -> bool:
    response = requests.post(
        f"https://api.github.com/repos/{repo}/actions/workflows/{WORKFLOW_FILE}/dispatches",
        headers={
            "Accept": "application/vnd.github+json",
            "Authorization": f"Bearer {token}",
            "X-GitHub-Api-Version": "2022-11-28",
        },
        json={"ref": ref, "inputs": {"model_version": str(model_version)}},
        timeout=10,
    )
    # GitHub answers 204 (or 200 when returning run details) on success.
    # Anything else raises, so a caller like the Prefect flow fails visibly
    # (with GitHub's reason in its logs) instead of reporting success.
    if response.status_code not in (200, 204):
        raise DeployTriggerError(
            f"GitHub refused to start {WORKFLOW_FILE} for {repo}: "
            f"{response.status_code} {response.text}"
        )
    return True


def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("--model-version", required=True)
    args = parser.parse_args()
    try:
        trigger_deploy(args.model_version, os.environ["GITHUB_REPO"], os.environ["GITHUB_TOKEN"])
    except DeployTriggerError as error:
        sys.exit(str(error))
    print(f"deploy requested for model v{args.model_version}")


if __name__ == "__main__":
    main()
```

**Walk through it:**
- `requests.post(...)` calls GitHub's `workflow_dispatch` endpoint with a token and the new model version.
- GitHub answers `204` (or `200`) on success.
- **Anything else raises `DeployTriggerError`** carrying GitHub's reason.

💡 **Why raise instead of returning `False`?** In the original project, this function returned `False` and printed the error to the terminal. When GitHub rejected a request (a token permission problem — Chapter 12), the flow still reported **Completed**, because nobody reads the terminal of an automated job. In pipelines, failures must *raise*, so the orchestrator records them.

### Step 2 — Its tests

You don't have a GitHub repository yet, so the tests replace `requests.post` with a fake — the same `monkeypatch` trick as the API's fake model:

📄 **File: `tests/test_trigger_deploy.py`**

```python
import pytest

from scripts import trigger_deploy as td


class FakeResponse:
    def __init__(self, status_code, text=""):
        self.status_code = status_code
        self.text = text


@pytest.fixture
def captured(monkeypatch):
    calls = {}

    def fake_post(url, headers, json, timeout):
        calls.update(url=url, headers=headers, json=json)
        return calls.get("response", FakeResponse(204))

    monkeypatch.setattr(td.requests, "post", fake_post)
    return calls


def test_trigger_deploy_dispatches_deploy_workflow(captured):
    assert td.trigger_deploy("3", repo="me/airbnb", token="tok") is True
    assert captured["url"] == "https://api.github.com/repos/me/airbnb/actions/workflows/deploy.yml/dispatches"
    assert captured["headers"]["Authorization"] == "Bearer tok"
    assert captured["json"] == {"ref": "main", "inputs": {"model_version": "3"}}


def test_trigger_deploy_accepts_200_with_run_details(captured):
    captured["response"] = FakeResponse(200)
    assert td.trigger_deploy("3", repo="me/airbnb", token="tok") is True


def test_trigger_deploy_raises_with_githubs_reason(captured):
    # A rejected trigger must not look like success: the Prefect task has to
    # fail, and GitHub's reason has to reach the Prefect logs.
    captured["response"] = FakeResponse(403, "Resource not accessible by personal access token")
    with pytest.raises(td.DeployTriggerError, match="403.*Resource not accessible"):
        td.trigger_deploy("3", repo="me/airbnb", token="weak")


def test_request_deploy_task_fails_when_github_rejects(captured, monkeypatch):
    import orchestrate_training

    monkeypatch.setenv("GITHUB_REPO", "me/airbnb")
    monkeypatch.setenv("GITHUB_TOKEN", "weak")
    captured["response"] = FakeResponse(403, "Resource not accessible by personal access token")
    with pytest.raises(td.DeployTriggerError):
        orchestrate_training.request_deploy.fn("4")
```

| Test | What it proves |
|---|---|
| `test_trigger_deploy_dispatches_deploy_workflow` | Correct URL, `Bearer` token and `model_version` input |
| `test_trigger_deploy_accepts_200_with_run_details` | Both GitHub success codes count as success |
| `test_trigger_deploy_raises_with_githubs_reason` | A `403` raises, and the message contains GitHub's reason |
| `test_request_deploy_task_fails_when_github_rejects` | The real Prefect task (called via `.fn`, which runs the function without Prefect's machinery) raises — so a flow would end *Failed* |

The last test imports `orchestrate_training`, so write that next before running the tests.

### Step 3 — `orchestrate_training.py`: the flow

📄 **File: `orchestrate_training.py`**

```python
"""Prefect flow (implementation.md, Task 10) — load -> split -> train_and_log x5 -> promote best -> request deploy.

MLFLOW_TRACKING_URI is read from the environment. Run once:
    python orchestrate_training.py
Serve on a weekly schedule (needs `prefect server start` running):
    python orchestrate_training.py --serve
"""
import os
import sys

import mlflow
from prefect import flow, get_run_logger, task

import features
import track_experiments
from registry import EXPERIMENT_NAME, pick_best, register_and_promote, require_tracking_uri
from scripts.trigger_deploy import trigger_deploy


@task(retries=2, retry_delay_seconds=5)
def load_data():
    return features.clean_data(features.load_data())


@task
def split_data(df):
    return features.split_data(df)


@task
def train_and_log(run_name, splits):
    run_id, metrics = track_experiments.train_and_log(run_name, *splits)
    get_run_logger().info(
        "%s rmse=%.2f mae=%.2f r2=%.3f size=%.1fMB",
        run_name, metrics["rmse"], metrics["mae"], metrics["r2"], metrics["model_size_mb"],
    )
    return run_id, metrics


@task
def promote_best_model(results):
    run_id = pick_best(results)
    version = register_and_promote(run_id)
    get_run_logger().info("promoted run %s as AirbnbPriceModel v%s @champion", run_id, version)
    return version


@task
def request_deploy(version):
    repo, token = os.environ.get("GITHUB_REPO"), os.environ.get("GITHUB_TOKEN")
    if not (repo and token):
        get_run_logger().warning("GITHUB_REPO/GITHUB_TOKEN not set; skipping deploy trigger")
        return False
    return trigger_deploy(version, repo, token)


@flow(name="airbnb-price-training")
def training_flow():
    require_tracking_uri()
    mlflow.set_experiment(EXPERIMENT_NAME)
    splits = split_data(load_data())
    results = {}
    for run_name in track_experiments.CONFIGS:
        run_id, metrics = train_and_log(run_name, splits)
        results[run_id] = metrics
    version = promote_best_model(results)
    request_deploy(version)
    return version


if __name__ == "__main__":
    if "--serve" in sys.argv:
        training_flow.serve(name="weekly-retrain", cron="0 3 * * 1")  # Mondays 03:00
    else:
        training_flow()
```

**Walk through it:**
- **The tasks are thin wrappers.** All real logic already exists and is tested (`features.py`, `track_experiments.train_and_log`, `registry.pick_best`/`register_and_promote`). Prefect adds retries, logging and history *around* it — nothing is duplicated.
- **Retries only on `load_data`** — loading data is the step most likely to fail temporarily (a network drive, a slow download). Retrying training wouldn't fix a bug in the code.
- **The same champion rule as Chapter 8** — an automatic run makes the same choice you made by hand.
- **Deploy is optional** — with no GitHub credentials it logs a warning and the flow still succeeds.
- **`--serve`** registers the weekly schedule and keeps running to execute it.

```bash
pytest tests/test_trigger_deploy.py -v      # 4 passed
pytest -q                                   # 46 passed (with MLFLOW_TRACKING_URI set)
```

## Chapter 11 — Continuous Integration with GitHub Actions

### What Problem This Solves

Your 46 tests protect you only if someone runs them — and people forget, or run them against a setup they've tweaked by hand. **Continuous Integration (CI)** runs the tests *automatically, on a clean machine*, for every proposed change, and shows ✅ or ❌ on the change *before* it's merged.

**GitHub Actions** is GitHub's built-in CI. A YAML file in `.github/workflows/` says *when* to run and *what* to run.

### Concepts Before Any Code

| Term | Meaning |
|---|---|
| **Remote / push** | Your repository on GitHub (`origin`); `git push` uploads commits to it |
| **Branch** | A parallel line of commits. You work on a branch, then merge it into `main` |
| **Pull request (PR)** | A request to merge a branch into `main`, with discussion and **checks** |
| **Workflow** | A YAML file describing automated jobs |
| **Job / step** | A workflow has jobs (each on a fresh virtual machine); a job has steps |
| **Runner** | GitHub's throwaway machine that executes a job |

**The CI puzzle.** Your tests include the real-registry tests (Chapter 8), which need an MLflow server with a `@champion`, and training needs data. GitHub's runner is a brand-new machine: no MLflow, no access to your laptop's DVC storage. So CI builds what it needs from scratch every time:
- a **throwaway MLflow server** started inside the job;
- a quick **champion trained on the committed 2,000-row sample** (Chapter 3) — that's what the sample was for.

```mermaid
flowchart LR
    PR["Pull request\nopened / updated"] --> T
    subgraph gha ["GitHub Actions (fresh Ubuntu machine)"]
        T["job: test\n1 install · 2 start MLflow\n3 seed @champion · 4 pytest"]
        B["job: build-image\ndocker build (no push)"]
        T -- "needs: test" --> B
    end
    B --> S["✅ / ❌ checks on the PR"]
```

### Step 1 — `scripts/ci_seed_model.py`

📄 **File: `scripts/ci_seed_model.py`**

```python
"""CI only: train a quick baseline on the committed sample and make it @champion,
so models:/AirbnbPriceModel@champion resolves for tests/test_model_registry.py.

Run as: DATA_PATH=tests/fixtures/listings_sample.csv python -m scripts.ci_seed_model
"""
import mlflow

from features import clean_data, load_data, split_data
from registry import EXPERIMENT_NAME, register_and_promote, require_tracking_uri
from track_experiments import train_and_log


def main():
    require_tracking_uri()
    mlflow.set_experiment(EXPERIMENT_NAME)
    run_id, metrics = train_and_log("linreg_baseline", *split_data(clean_data(load_data())))
    version = register_and_promote(run_id)
    print(f"seeded AirbnbPriceModel v{version} @champion (rmse={metrics['rmse']:.2f})")


if __name__ == "__main__":
    main()
```

It reuses the same `train_and_log` and `register_and_promote` as the real pipeline — no CI-only shortcuts. It trains LinearRegression because it's the fastest: CI checks that the *plumbing* works, not which model is best. `DATA_PATH` will point it at the sample.

### Step 2 — The workflow: `.github/workflows/ci.yml`

📄 **File: `.github/workflows/ci.yml`**

```yaml
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      # The DVC remote lives on a laptop; CI trains on the committed sample.
      DATA_PATH: tests/fixtures/listings_sample.csv
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start ephemeral MLflow server
        run: |
          mlflow server --backend-store-uri sqlite:///mlflow.db \
            --artifacts-destination ./mlartifacts \
            --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/health && exit 0
            sleep 2
          done
          cat mlflow.log
          exit 1
      - name: Seed AirbnbPriceModel@champion
        run: python -m scripts.ci_seed_model
      - run: pytest -v

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: airbnb-price-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
```

**Reading it:**

| Part | Meaning |
|---|---|
| `on: pull_request` | Run when a PR is opened or gets new commits. A plain push to `main` runs nothing |
| `runs-on: ubuntu-latest` | A fresh Linux machine, thrown away afterwards |
| `env:` | Environment variables for every step. Port **5000** is fine on GitHub's machines (no AirPlay) |
| `MLFLOW_DISABLE_AGENT_HINT: "1"` | Silences an informational MLflow log line (a hint aimed at AI coding tools) so the CI log stays readable. Harmless either way |
| `actions/checkout` | Downloads your repository into the machine |
| `setup-python` + `cache: pip` | Installs Python 3.11 and caches downloaded packages between runs |
| `mlflow server … &` | `&` runs the server in the background so the job can continue |
| the `for` loop | **Waits until the server is actually ready** (polls `/health`) instead of guessing with `sleep 30`; if it never comes up, prints the server log and fails with a useful message |
| `needs: test` | `build-image` starts only if `test` passed |
| `push: false` | Build the image to prove the `Dockerfile` works — but don't publish unreviewed code. Publishing is Chapter 12's controlled job |
| `cache-from/to: type=gha` | Store Docker layers in GitHub's cache so later builds are faster |

💡 **Use current action versions.** Actions like `actions/checkout@v7` get new major versions; old ones eventually stop working. Check the latest before writing a workflow:
```bash
git ls-remote --tags --refs https://github.com/actions/checkout.git | awk -F/ '{print $NF}' | grep -E '^v[0-9]+$' | sort -V | tail -1
```

### 🧪 See It Fail — a red pull request

**Don't skip this.** Knowing what a CI failure looks like, and how to fix it, is one of the most useful habits to build early. On the same branch, break a test on purpose — in `tests/test_schemas.py`, change `== "USD"` to `== "EUR"`:

Fix it back and push:
```bash
git revert --no-edit HEAD
git push

CI turns ✅ again — and faster than the first time (cached packages and Docker layers):

| Job | First run | Cached re-run |
|---|---|---|
| test | ~2.5 min | ~2 min |
| build-image | ~1.3 min | **~30 s** — the ~500 MB dependency layer was reused (Chapter 9's layer ordering paying off) |

## Chapter 12 — Continuous Deployment: Publish the Image When the Model Changes

### What Problem This Solves

CI *checks* changes. **Continuous Deployment (CD)** *ships* them: it builds the API image and publishes it to a **registry** (Docker Hub) that any server can pull from. In MLOps, a release isn't only triggered by new code — it's triggered by **a new model**:

```mermaid
flowchart LR
    P["🔁 Prefect flow\npromotes vN to @champion"] -- "trigger_deploy.py\n(GitHub API, model_version=N)" --> D
    subgraph gha ["GitHub Actions: deploy.yml"]
        D["build image\namd64 + arm64"] --> PUSH["push"]
    end
    PUSH --> HUB[("🐳 Docker Hub\n:latest · :model-vN · :commit-sha")]
    HUB -- "docker pull / run" --> SRV["any server or laptop"]
    SRV -- "loads @champion at startup" --> MLF["MLflow"]
```

The image stays model-free (Chapter 9); the `model-vN` tag records *which promotion caused this release*.

### Concepts Before Any Code

| Term | Meaning |
|---|---|
| **Container registry** | A website that stores images (Docker Hub, GitHub Container Registry, AWS ECR…) |
| **Tag** | A label on an image version: `:latest`, `:model-v4` |
| **`workflow_dispatch`** | A workflow that runs only when asked — from the GitHub UI or its API |
| **Secret** | An encrypted value stored in the repository settings; GitHub hides it in logs |
| **Multi-architecture image** | One tag containing builds for several CPU types. GitHub's runners are Intel/AMD (`amd64`); Apple Silicon Macs are `arm64` |
| **QEMU** | An emulator that lets an `amd64` runner build the `arm64` version |

### Step 1 — Docker Hub account and access token

1. Sign up (free) at https://hub.docker.com and note your **username** exactly.
2. **Account settings → Personal access tokens → Generate new token**: description `github-actions`, permissions **Read & Write**. **Copy it now** — it's shown only once.

### Step 2 — Store it as GitHub secrets

In your repository: **Settings → Secrets and variables → Actions → New repository secret**. Create two:

| Name | Value |
|---|---|
| `DOCKERHUB_USERNAME` | your Docker Hub username |
| `DOCKERHUB_TOKEN` | the token from Step 1 |

💡 Tokens go straight from Docker Hub into GitHub's encrypted storage — never into a file, a commit or a chat.

### Step 3 — The workflow: `.github/workflows/deploy.yml`

```bash
git switch -c deploy-workflow
```

📄 **File: `.github/workflows/deploy.yml`**

```yaml
name: Deploy

# Runs only when asked: by hand (Actions tab -> Deploy -> Run workflow) or by
# scripts/trigger_deploy.py, which the Prefect flow calls after promoting a new
# @champion. The image doesn't contain the model (it loads @champion at
# startup), so model-v<N> records which promotion triggered this release.
on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "AirbnbPriceModel version just promoted to @champion"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # QEMU lets this amd64 runner also build the arm64 (Apple Silicon) image.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # One tag, two builds: Docker picks the right one for each machine.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-price-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-price-api:model-v${{ inputs.model_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-price-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            airbnb.model-version=${{ inputs.model_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
```

**Reading it:**

| Part | Meaning |
|---|---|
| `on: workflow_dispatch` + `inputs.model_version` | Runs **only when asked**, receiving the model version |
| `setup-qemu-action` + `platforms: linux/amd64,linux/arm64` | Build for Intel/AMD *and* Apple Silicon under one tag |
| `login-action` | Logs in to Docker Hub with the token (never a password) |
| `push: true` | Unlike CI, this job **publishes** |
| three `tags` | `latest` = newest · `model-vN` = which champion triggered it · commit SHA = exact code |
| `labels` | Metadata baked into the image (`docker image inspect` shows them) |

💡 **Why build for arm64 too?** The original project first built only for `amd64` (GitHub's runners). On an Apple Silicon Mac, `docker pull` then failed with `no matching manifest for linux/arm64/v8`. It *could* run with `--platform linux/amd64` under emulation (slower), but a plain pull failing for every Apple Silicon user isn't acceptable. The cost: each deploy takes ~5 minutes instead of ~1, because the arm64 half is built under emulation.

### Step 7 — Let the flow trigger deploys: a GitHub token

`trigger_deploy.py` (Chapter 10) calls GitHub's API, which needs a **fine-grained personal access token**:

GitHub → your avatar → **Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token**:
- **Name:** `airbnb-deploy-trigger`, with an expiration (e.g. 90 days)
- **Repository access:** *Only select repositories* → your repository
- **Permissions → Repository permissions → Actions: Read and write** — nothing else

⚠️ **The permission is the classic mistake.** Fine-grained tokens start with **no** permissions; each must be granted explicitly. In the original project the token lacked *Actions: Read and write*, and GitHub answered `403 Resource not accessible by personal access token`.

| Error | Usual cause |
|---|---|
| `401 Bad credentials` | Token not exported in *this* terminal, expired, or copied incompletely |
| `403 Resource not accessible by personal access token` | Token lacks **Actions: Read and write** |
| `404 Not Found` | Token not granted this repository, or a typo in `GITHUB_REPO` |

Use the token **only in your work terminal** — never in a file:
```bash
export GITHUB_REPO=<your-github-username>/<your-repo>
export GITHUB_TOKEN=<paste your token>
```

## Chapter 13 — One Command for Everything: Docker Compose

### What Problem This Solves

Running the stack by hand means: a terminal for `mlflow server` with a long list of flags, then a separate `docker run` for the API with the right ports and environment variables — in the right order. **Docker Compose** describes all of it in one file, `docker-compose.yml`, and starts it with one command. It also handles *ordering*: the API must not start before MLflow is ready, or it has nothing to load its model from.

```mermaid
flowchart LR
    subgraph mac ["Your computer"]
        subgraph net ["Compose network"]
            MLF["mlflow-server\n:5000 inside\nhealthcheck /health"]
            API["api\n:8000 inside"]
            API -- "http://mlflow-server:5000\n(service name = hostname)" --> MLF
        end
        DISK[("./mlflow.db\n./mlartifacts")]
        MLF -- "folder mounted at /mlflow" --> DISK
        HOST["host tools: Prefect flow,\npytest, browser"]
    end
    HOST -- "127.0.0.1:5001" --> MLF
    HOST -- "127.0.0.1:8001" --> API
```

### Concepts Before Any Code

| Term | Meaning |
|---|---|
| **Service** | One container definition in `docker-compose.yml` (`mlflow-server`, `api`) |
| **Compose network** | A private network Compose creates; inside it, **a service's name is its hostname** |
| **Bind mount** `.:/mlflow` | A folder on your computer appears inside the container — changes are shared both ways |
| **Healthcheck** | A command Docker runs repeatedly; when it succeeds, the container is *healthy* |
| **`depends_on: condition: service_healthy`** | Start this service only after that one is *healthy* — not merely *started* |

### The Decision: Reuse Your Existing MLflow Data

| Option | Trade-off |
|---|---|
| **Reuse `./mlflow.db` + `./mlartifacts`** ✅ | All your runs, versions and `@champion` carry over; host tools keep using `http://127.0.0.1:5001` unchanged. Compose becomes a drop-in replacement for your MLflow terminal |
| A fresh, empty Docker volume | Isolated, but empty — you'd have to retrain before the API can start, and keep two separate histories |

⚠️ **Never run two MLflow servers on the same SQLite file.** SQLite is a single file with simple locking; two servers writing it at once can corrupt it. So the MLflow terminal's server must be stopped first.

### Step 1 — Back up the MLflow database

Before touching data, take a consistent snapshot. SQLite's backup API is safe even while the server is running:
```bash
mkdir -p ~/mlflow-backups/nyc-airbnb
python - <<'EOF'
import os, sqlite3, time
target = os.path.expanduser(f"~/mlflow-backups/nyc-airbnb/mlflow-{time.strftime('%Y%m%d-%H%M')}.db")
src, dst = sqlite3.connect("mlflow.db"), sqlite3.connect(target)
src.backup(dst)
dst.close(); src.close()
check = sqlite3.connect(target)
print("backup:", target)
print("integrity:", check.execute("PRAGMA integrity_check").fetchone()[0],
      "| aliases:", check.execute("select alias, version from registered_model_aliases").fetchall())
EOF
```
Expected:
```
backup: /Users/you/mlflow-backups/nyc-airbnb/mlflow-20260924-2320.db
integrity: ok | aliases: [('champion', 4)]
```

### Step 2 — Stop the MLflow terminal's server

In the **MLflow terminal**, press **Ctrl-C** and wait for the prompt. Then, in the work terminal:
```bash
lsof -nP -iTCP:5001 -sTCP:LISTEN || echo "port 5001 free"
pgrep -fl "mlflow server" || echo "no mlflow server running"
```
Both should say free / not running. (You can close the MLflow terminal — Compose replaces it.)

### Step 3 — Write `docker-compose.yml`

```bash
git switch -c docker-compose
```

📄 **File: `docker-compose.yml`**

```yaml
# One command for the serving stack: the MLflow tracking server + registry,
# and the prediction API. It replaces the separate "mlflow server" terminal
# and the separate `docker run`.
#
# The MLflow service reuses this folder's mlflow.db and mlartifacts/, so all
# runs and @champion carry over. Stop any host `mlflow server` first: two
# servers must never write the same SQLite file.
services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.16.1   # same version as requirements.txt, so same DB schema
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      --host 0.0.0.0 --port 5000
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow-server:*"
    volumes:
      # The whole folder, not just mlflow.db: SQLite writes its journal file
      # next to the database, and that must land on disk, not in the container.
      - .:/mlflow
    ports:
      - "5001:5000"   # host 5001: macOS AirPlay Receiver holds 5000
    healthcheck:
      # The MLflow image has Python but not necessarily curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    image: airbnb-price-api:local
    environment:
      # The one setting every component reads; inside Compose's network the
      # MLflow service is reachable by its service name.
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    ports:
      - "8001:8000"   # host 8000 is used by another project's container
    depends_on:
      mlflow-server:
        condition: service_healthy   # don't race MLflow's startup
    restart: on-failure
```

**Reading it:**

| Part | Meaning |
|---|---|
| `image: ghcr.io/mlflow/mlflow:v3.16.1` | The official MLflow image, pinned to **the same version** as `requirements.txt` — a different server version might try to migrate your database's structure |
| `sqlite:////mlflow/mlflow.db` | Four slashes = `sqlite:///` + the absolute path `/mlflow/mlflow.db` |
| `volumes: - .:/mlflow` | Your project folder appears inside the container at `/mlflow`, so `mlflow.db` and `mlartifacts/` are the same files as before |
| `ports: "5001:5000"` | Reach MLflow from your computer on 5001; inside the network it's 5000 |
| `healthcheck` | Every 10 s, ask MLflow's `/health` endpoint (with Python — the image may not include `curl`) |
| `build: .` + `image: airbnb-price-api:local` | Build the API from your `Dockerfile`, with the same name as Chapter 9 |
| `MLFLOW_TRACKING_URI: http://mlflow-server:5000` | Inside the network, the MLflow service is reachable **by its name** |
| `depends_on … service_healthy` | Don't start the API until MLflow is healthy |
| `restart: on-failure` | If the API exits with an error, Docker restarts it |

💡 **Why mount the whole folder, not just `mlflow.db`?** While SQLite saves changes, it writes a temporary *journal* file **next to** the database. Mount only the `.db` file, and the journal would live inside the container; a crash mid-write could then leave the database damaged. Mounting the folder keeps them together on your disk.

🪟 This is where keeping the project inside WSL's own disk (not `/mnt/c/…`) matters: folder mounts from the Windows drive are slow and can have permission problems.

Check the file before running anything:
```bash
docker compose config --quiet && echo "compose file valid"
```

### Step 4 — Start the stack and watch the ordering

```bash
docker compose up -d --build
```
Expected (trimmed):
```
 Container …-mlflow-server-1  Started
 Container …-mlflow-server-1  Waiting
 Container …-mlflow-server-1  Healthy
 Container …-api-1            Starting
 Container …-api-1            Started
```
The API starts only once MLflow is **healthy**. Check its log:
```bash

```
```
INFO:     Loading models:/AirbnbPriceModel@champion from http://mlflow-server:5000
INFO:     Model loaded
INFO:     Application startup complete.
```

### Step 5 — Verify

```bash
docker compose ps                                  # mlflow-server: healthy · api: Up
curl -s -X POST localhost:8001/predict -H 'Content-Type: application/json' -d '{
  "neighbourhood_group": "Manhattan", "neighbourhood": "Midtown",
  "latitude": 40.7549, "longitude": -73.984, "room_type": "Entire home/apt",
  "minimum_nights": 2, "number_of_reviews": 20, "reviews_per_month": 1.0,
  "calculated_host_listings_count": 1, "availability_365": 180}'
# {"predicted_price":244.25,"currency":"USD"}
```

Your host tools work **unchanged** — same address, 5001:
```bash

pytest -q                                          # 46 passed
```

In the browser, http://127.0.0.1:5001 shows all your runs and model versions — nothing was lost.

**Restart test** — data lives on your disk, not inside containers:
```bash

docker compose up -d
docker compose ps
```
Still `@champion`, still $244.25.

💡 The MLflow container runs as root but writes into your project folder. On macOS, Docker Desktop maps those files back to *your* user, so new runs' artifacts are ordinary files you own.

🪟 In WSL2 the files the container creates may be owned by `root` (check with `ls -l mlartifacts`). If a later host command such as Appendix E's cleanup reports `Permission denied`, give them back to yourself: `sudo chown -R "$USER" mlflow.db mlartifacts`.

### Step 6 — Everyday commands

```bash

docker compose ps               # status and health
docker compose logs -f api      # follow the API's log (Ctrl-C to stop following)
docker compose restart api      # after promoting a new champion: reload the model
docker compose down             # stop and remove containers (data stays on disk)
```

The Prefect flow works exactly as before (`MLFLOW_TRACKING_URI=http://127.0.0.1:5001`). After it promotes a new champion, `docker compose restart api` makes the local API serve it.

⚠️ From now on, **don't also start the old `mlflow server` command** while Compose is running — both would write the same database.

git commit -m "feat: docker compose stack for MLflow + API, reusing local MLflow data"
git push -u origin docker-compose
```

"It worked when I built it" isn't the same as "it works now". Later chapters changed things that earlier ones depended on. So finish by **re-checking everything against the current state** — not from memory — and by writing the page strangers will read first.

Run each check. Every row should pass.

### Step 3 — Write the README

The README is your repository's front page, written for someone who has never seen the project. Suggested sections:

1. **What it does** — one paragraph, and a diagram of the whole loop (GitHub renders ```` ```mermaid ```` blocks).
2. **Results** — the five-model table from Chapter 7, and the **champion rule** (≤ 100 MB, lowest RMSE) with its reason.

### The finished system

```mermaid
flowchart LR

    subgraph PF ["🔁 Prefect flow (weekly, Mon 03:00 UTC)"]
        direction TB

    end

    DC["🧩 docker compose up -d"] -.-> MLF

```

### The real problems behind this guide's 💡 notes

Every one of these actually happened while this project was built. Each teaches something general.

| # | Problem | Chapter | Lesson |
|---|---|---|---|
| 1 | A test used a relative path and failed from another folder | 3 | Build paths from `__file__`, not the current directory |
| 2 | `httpx` deprecation warning | 1, 6 | Read warnings — they're future errors |
| 3 | The API froze ~4 minutes, silently, when MLflow was down | 6 | Log before slow calls; limit retries so failures are fast and clear |
| 4 | Anaconda's `mlflow`/`prefect` shadowed the project's | 7, 10 | Check `which <tool>` before trusting a command |
| 5 | Port 5000 taken by AirPlay; another port taken by another project | 7, 9 | Check who holds a port before binding; don't stop what isn't yours |
| 6 | Tree models refused by skops (`UntrustedTypesFoundException`) | 7 | Test *every* variant you use; trust only the exact type needed |
| 7 | A `grep` pipe hid a crash (exit code 0) | 7 | Check the real program's exit code |
| 8 | The best model was 326 MB | 8 | "Best metric" isn't the only criterion; write trade-offs down as rules |
| 9 | Registering through an MLflow 3 compatibility fallback | 8 | Treat fallback warnings as bugs; use the current API |
| 10 | `mlflow-skinny` lacked `skops` | 9 | Slim images need their dependencies checked explicitly |
| 11 | A personal email almost went public | 1, 11 | Set a noreply email first; review what you publish before the first push |
| 12 | The published image didn't run on Apple Silicon | 12 | Build for the platforms your users actually have |
| 13 | A rejected deploy (`403`) reported "Completed" | 10, 12 | In pipelines, failures must *raise*, not print |
| 14 | Moving MLflow into Compose risked two servers on one SQLite file | 13 | Back up first, stop the old server, pin the same version, mount the folder |

### Where to go next

- **Clean up artifacts automatically** (Appendix E), or cap/drop the 326 MB forest from the scheduled configs.
- **Better features** — size, bedrooms, amenities would lift accuracy well beyond R² ≈ 0.46.
- **Shared infrastructure** — DVC remote on S3, a hosted MLflow server, the Prefect flow on an always-on machine.
- **Monitoring** — log predictions and watch for **data drift** (new neighbourhoods, price shifts) to decide when retraining matters.
- **Cloud deployment** — run the published image on a cloud service, pointing `MLFLOW_TRACKING_URI` at a hosted MLflow.

### "My personal email is in my commits"

Only safe **before you've pushed** — it rewrites every commit's ID:
```bash
NR="12345678+yourname@users.noreply.github.com"
git config user.email "$NR"
FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter \
  "export GIT_AUTHOR_EMAIL='$NR' GIT_COMMITTER_EMAIL='$NR'" -- --all
git update-ref -d refs/original/refs/heads/main          # remove filter-branch's backup of the old commits
git reflog expire --expire=now --all && git gc -q --prune=now
git log --format='%ae' | sort -u                         # only the noreply address
```
If you've already pushed, the old commits are public; rewriting would break everyone else's copy.

## Appendix D — Glossary

| Term | Meaning |
|---|---|
| **Alias** | A movable label on a registered model version (`@champion`) |
| **Artifact** | A file produced by a run — here, the saved model |
| **Backend store** | MLflow's database of runs, parameters and metrics (`mlflow.db`) |
| **Bind mount** | A host folder made visible inside a container |
| **CI / CD** | Continuous Integration (test every change) / Continuous Deployment (ship automatically) |
| **Container / image** | A running instance / the read-only package it runs from |
| **Cron** | A five-field schedule: minute hour day month weekday |
| **Deployment (Prefect)** | A named, schedulable version of a flow |
| **DVC remote** | Storage outside the project that holds versioned data |
| **Experiment / run** | A named group of training runs / one training attempt |
| **Fixture (pytest)** | A function that prepares something tests need |
| **Flow / task (Prefect)** | A pipeline / one step of it |
| **High cardinality** | A categorical column with many distinct values |
| **Layer (Docker)** | One cached step of an image build |
| **MAE / RMSE / R²** | Average miss / miss with big errors weighted more / share of variation explained |
| **MD5 hash** | A fingerprint of a file's bytes |
| **Multi-arch image** | One tag containing builds for several CPU types (amd64, arm64) |
| **Pinning** | Recording exact dependency versions (`package==1.2.3`) |
| **Pointer file** | DVC's small `.dvc` file that Git tracks in place of the data |
| **Pull request (PR)** | A proposed merge of a branch, with automated checks |
| **Registry (model)** | A catalogue of approved model versions |
| **Secret (GitHub)** | An encrypted repository setting, hidden in logs |
| **skops** | A safer model file format than pickle, with an allow-list of loadable types |
| **Virtual environment** | A project-private Python and set of libraries |
| **workflow_dispatch** | A GitHub Actions trigger that runs only when requested |

## Appendix E — Cleanup and Freeing Disk Space

**Stop everything:** `docker compose down`, Ctrl-C the Prefect server, `unset GITHUB_TOKEN`.

**Why disk grows:** every full retrain saves ~377 MB of models, mostly the 326 MB `rf_100` that the size rule never promotes. `du -sh mlartifacts` shows the total.

**Free it.** Deleting a run only hides it, and in MLflow 3 each model is its own object (a *logged model*, `models:/m-…`) that outlives its run. So the recipe deletes both the old `rf_100` runs **and** their models, then runs `mlflow gc` to erase them for good, files included.

`mlflow gc` works on the database file directly, but it needs a **running** server to delete the model files (they're stored through the server's artifact proxy). Compose's MLflow can't be used for this: `gc` on your computer and the server in the container would both write `mlflow.db`, and SQLite locking isn't reliable across the container boundary. So stop the stack and use a temporary server on your computer, just for the cleanup:

⚠️ *Back up first (Chapter 13, Step 1).*

```bash
docker compose down
(exec mlflow server --backend-store-uri sqlite:///mlflow.db --artifacts-destination ./mlartifacts \
   --host 127.0.0.1 --port 5001 > mlflow.log 2>&1) &
until curl -sf http://127.0.0.1:5001/health >/dev/null; do sleep 2; done
export MLFLOW_TRACKING_URI=http://127.0.0.1:5001
du -sh mlartifacts

python - <<'EOF'
import mlflow
from mlflow import MlflowClient
client = MlflowClient()
champion_run = client.get_model_version_by_alias("AirbnbPriceModel", "champion").run_id
runs = mlflow.search_runs(experiment_names=["airbnb-price-prediction"],
                          filter_string="tags.mlflow.runName = 'rf_100'")
deleted = 0
for run_id in runs["run_id"]:
    if run_id == champion_run:          # never delete what the API serves
        continue
    for output in client.get_run(run_id).outputs.model_outputs:
        client.delete_logged_model(output.model_id)
    client.delete_run(run_id)
    deleted += 1
print("deleted", deleted, "rf_100 runs and their models")
EOF

mlflow gc --backend-store-uri sqlite:///mlflow.db
du -sh mlartifacts
pkill -f "mlflow server.*--port 5001"
while lsof -nP -iTCP:5001 -sTCP:LISTEN >/dev/null; do sleep 1; done   # wait until it has really stopped
docker compose up -d
```
Expected (IDs differ):
```
deleted 4 rf_100 runs and their models
Run with ID … has been permanently deleted.
Logged model with ID m-… has been permanently deleted.
```
…one line per run and per model (4 rounds of training so far: Chapters 7, 10 twice, and 12), and the second `du` is smaller by about 326 MB per deleted run. Empty `m-…` folders may remain in `mlartifacts/`; they take no space. Afterwards, the Chapter 8 Step 6 command still prints `TransformedTargetRegressor 244.25`: the champion is untouched.

💡 This was tested on a throwaway copy of the setup (a scratch server with a few `rf_100` runs), not on the original project's data. That's why the backup comes first.

**Revoke tokens you no longer need:** GitHub → Settings → Developer settings → Personal access tokens; Docker Hub → Account settings → Personal access tokens.

      var label = h1.getAttribute("data-label");
      openLine(label ? label + " · " + h1.getAttribute("data-short") : h1.getAttribute("data-title"));
      return;
    }
    if (!block.classList.contains("chapter")) return;
    var h2 = block.querySelector(":scope > h2");
    if (!h2) return;
    var label2 = h2.getAttribute("data-label");
    var isChapter = /^Chapter/.test(label2 || "");
    var li = el("li", "station");
    var a = el("a");
    a.href = "#" + h2.id;
    a.innerHTML = '<span class="dot" aria-hidden="true"></span><span>' +
      (label2 ? '<span class="ch-no">' + escapeHtml(label2) + "</span>" : "") +
      escapeHtml(h2.getAttribute("data-short") || h2.getAttribute("data-title")) + "</span>";
    li.appendChild(a);
    var subs = el("ol", "subs");
    Array.prototype.forEach.call(block.querySelectorAll("h3"), function (h3) {
      var sa = el("a", null, escapeHtml(h3.getAttribute("data-title").replace(/^(🧪|✅)\s*/, "")));
      sa.href = "#" + h3.id;
      var sli = el("li"); sli.appendChild(sa); subs.appendChild(sli);
    });
    if (subs.children.length) li.appendChild(subs);
    lineEl.appendChild(li);
    var entry = { section: block, h2: h2, li: li, isChapter: isChapter };
    chapters.push(entry);
  });

  // ---------- 7. chapter completion + next links ----------
  var done = {};
  try { (JSON.parse(store(STORE_DONE) || "[]") || []).forEach(function (id) { done[id] = true; }); } catch (e) { done = {}; }
  var chapterEntries = chapters.filter(function (c) { return c.isChapter; });
  function paintDone() {
    var count = 0;
    chapterEntries.forEach(function (c) {
      var isDone = !!done[c.h2.id];
      if (isDone) count++;
      c.li.classList.toggle("done", isDone);
      if (c.button) {
        c.button.setAttribute("aria-pressed", isDone ? "true" : "false");
        c.button.textContent = isDone ? "Chapter complete" : "Mark " + c.h2.getAttribute("data-label") + " complete";
      }
    });
    document.getElementById("meter-text").textContent = count + " of " + chapterEntries.length + " chapters complete";
    document.getElementById("meter-fill").style.width = (chapterEntries.length ? 100 * count / chapterEntries.length : 0) + "%";
  }
  chapters.forEach(function (c, i) {
    var foot = el("div", "chapter-foot");
    if (c.isChapter) {
      var b = el("button", "done-btn");
      b.type = "button";
      b.addEventListener("click", function () {
        if (done[c.h2.id]) delete done[c.h2.id]; else done[c.h2.id] = true;
        store(STORE_DONE, JSON.stringify(Object.keys(done)));
        paintDone();
      });
      c.button = b;
      foot.appendChild(b);
    }
    var next = chapters[i + 1];
    if (next) {
      var nl = el("a", "next-link");
      nl.href = "#" + next.h2.id;
      nl.innerHTML = "<small>Next</small><span>" +
        escapeHtml((next.h2.getAttribute("data-label") ? next.h2.getAttribute("data-label") + ": " : "") +
        (next.h2.getAttribute("data-short") || next.h2.getAttribute("data-title"))) + " →</span>";
      foot.appendChild(nl);
    }
    if (foot.children.length) c.section.appendChild(foot);
  });
  paintDone();

  // ---------- 8. copy buttons ----------
  article.addEventListener("click", function (e) {
    var btn = e.target.closest(".copy");
    if (!btn) return;
    var code = btn.closest(".code").querySelector("pre code");
    var text = code.textContent.replace(/\n$/, "");
    function ok() {
      btn.textContent = "Copied"; btn.classList.add("done");
      setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
    }
    function fallback() {
      var range = document.createRange();
      range.selectNodeContents(code);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.textContent = "Selected, press ⌘C";
      setTimeout(function () { btn.textContent = "Copy"; }, 2400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  });

  // ---------- 9. navigation: in-page links, drawer ----------
  function closeNav() {
    document.body.classList.remove("nav-open");
    document.getElementById("menu-btn").setAttribute("aria-expanded", "false");
  }
  document.getElementById("menu-btn").addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("scrim").addEventListener("click", closeNav);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeNav(); });
  function goTo(id, smooth) {
    var target = document.getElementById(id);
    if (!target) return;
    target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* hash is optional */ }
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = decodeURIComponent(a.getAttribute("href").slice(1));
    if (!document.getElementById(id)) return;
    e.preventDefault();
    closeNav();
    goTo(id, true);
  });

  // ---------- 10. scroll spy + progress ----------
  var spyHeads = Array.prototype.slice.call(article.querySelectorAll("section.chapter > h2, section.chapter h3"));
  var progress = document.getElementById("progress");
  var topbarTitle = document.getElementById("topbar-title");
  var ticking = false, lastChapter = null, lastSub = null;
  function spy() {
    ticking = false;
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    progress.style.transform = "scaleX(" + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ")";
    var active = null;
    for (var i = 0; i < spyHeads.length; i++) {
      if (spyHeads[i].getBoundingClientRect().top < 140) active = spyHeads[i]; else break;
    }
    var chapter = active ? chapters.filter(function (c) { return c.section.contains(active); })[0] : null;
    if (chapter !== lastChapter) {
      if (lastChapter) lastChapter.li.classList.remove("current");
      if (chapter) {
        chapter.li.classList.add("current");
        topbarTitle.textContent = (chapter.h2.getAttribute("data-label") ? chapter.h2.getAttribute("data-label") + " · " : "") +
          (chapter.h2.getAttribute("data-short") || chapter.h2.getAttribute("data-title"));
        var sidebar = document.getElementById("sidebar");
        var r = chapter.li.getBoundingClientRect();
        if (r.top < 80 || r.bottom > window.innerHeight - 40) {
          sidebar.scrollTop += r.top - window.innerHeight / 3;
        }
      } else {
        topbarTitle.textContent = "MLOps from Scratch";
      }
      lastChapter = chapter;
    }
    var sub = active && active.tagName === "H3" ? toc.querySelector('.subs a[href="#' + active.id + '"]') : null;
    if (sub !== lastSub) {
      if (lastSub) lastSub.classList.remove("current");
      if (sub) sub.classList.add("current");
      lastSub = sub;
    }
  }
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, { passive: true });
  window.addEventListener("resize", spy);

  // ---------- 11. search ----------
  var search = document.getElementById("search");
  var results = document.getElementById("results");
  var index = [];
  Array.prototype.forEach.call(article.querySelectorAll("h2, h3"), function (h) {
    var owner = chapters.filter(function (c) { return c.section.contains(h); })[0];
    index.push({ id: h.id, text: (h.getAttribute("data-title") || "").replace(/^(🧪|✅)\s*/, ""),
      where: owner && owner.h2 !== h ? (owner.h2.getAttribute("data-label") || owner.h2.getAttribute("data-title")) : "" });
  });
  Array.prototype.forEach.call(article.querySelectorAll(".kind-file .label b"), function (b) {
    var box = b.closest(".code");
    var owner = chapters.filter(function (c) { return c.section.contains(box); })[0];
    if (!box.id) box.id = slugify("file " + b.textContent);
    index.push({ id: box.id, text: b.textContent, where: "File" + (owner && owner.h2.getAttribute("data-label") ? " · " + owner.h2.getAttribute("data-label") : "") });
  });
  var activeResult = 0;
  function runSearch() {
    var q = search.value.trim().toLowerCase();
    if (!q) { results.hidden = true; toc.hidden = false; return; }
    var terms = q.split(/\s+/);
    var hits = index.filter(function (item) {
      var hay = (item.text + " " + item.where).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    }).slice(0, 25);
    results.innerHTML = "";
    if (!hits.length) results.appendChild(el("li", "empty", "No heading or file matches “" + escapeHtml(search.value.trim()) + "”."));
    hits.forEach(function (item, i) {
      var li = el("li");
      var a = el("a", i === 0 ? "active" : "", escapeHtml(item.text) + (item.where ? "<small>" + escapeHtml(item.where) + "</small>" : ""));
      a.href = "#" + item.id;
      li.appendChild(a); results.appendChild(li);
    });
    activeResult = 0;
    results.hidden = false; toc.hidden = true;
  }
  search.addEventListener("input", runSearch);
  search.addEventListener("keydown", function (e) {
    var links = results.querySelectorAll("a");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!links.length) return;
      e.preventDefault();
      links[activeResult].classList.remove("active");
      activeResult = (activeResult + (e.key === "ArrowDown" ? 1 : links.length - 1)) % links.length;
      links[activeResult].classList.add("active");
    } else if (e.key === "Enter" && links.length) {
      e.preventDefault();
      links[activeResult].click();
    } else if (e.key === "Escape") {
      search.value = ""; runSearch(); search.blur();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    if (window.matchMedia("(max-width: 960px)").matches) document.body.classList.add("nav-open");
    search.focus();
  });

  // ---------- 12. theme + diagrams ----------
  function isDark() {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.getElementById("theme-btn").addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store(STORE_THEME, next);
  });

  var ownMermaid = false;
  function token(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  function renderDiagrams() {
    var diagrams = article.querySelectorAll("pre.mermaid");
    Array.prototype.forEach.call(diagrams, function (d) {
      d.removeAttribute("data-processed");
      d.textContent = d.getAttribute("data-src");
    });
    window.mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      securityLevel: "strict",
      fontFamily: token("--body"),
      flowchart: { htmlLabels: true, curve: "basis" },
      themeVariables: {
        darkMode: isDark(),
        background: token("--surface"),
        fontSize: "14px",
        primaryColor: token("--accent-soft"),
        primaryBorderColor: token("--accent"),
        primaryTextColor: token("--ink"),
        secondaryColor: token("--ground"),
        tertiaryColor: token("--ground"),
        lineColor: token("--muted"),
        textColor: token("--ink"),
        clusterBkg: token("--ground"),
        clusterBorder: token("--rule"),
        edgeLabelBackground: token("--surface"),
        titleColor: token("--ink"),
        actorBkg: token("--accent-soft"),
        actorBorder: token("--accent"),
        actorTextColor: token("--ink"),
        signalColor: token("--ink-2"),
        signalTextColor: token("--ink"),
        labelBoxBkgColor: token("--ground"),
        labelBoxBorderColor: token("--rule"),
        labelTextColor: token("--ink"),
        loopTextColor: token("--ink"),
        noteBkgColor: token("--warn-bg"),
        noteBorderColor: token("--warn-line"),
        noteTextColor: token("--ink")
      }
    });
    window.mermaid.run({ nodes: diagrams }).catch(function () { /* the source stays visible */ });
  }
  function loadMermaid() {
    var pending = Array.prototype.some.call(article.querySelectorAll("pre.mermaid"), function (d) {
      return !d.querySelector("svg");
    });
    if (!pending) return;
    var s = document.createElement("script");
    s.src = MERMAID_URL;
    s.onload = function () { ownMermaid = true; renderDiagrams(); };
    document.head.appendChild(s);
  }
  // Some hosts render mermaid themselves; only load the library if nothing drew the diagrams.
  setTimeout(loadMermaid, 900);
  function onThemeChange() { if (ownMermaid) renderDiagrams(); }
  new MutationObserver(onThemeChange).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", onThemeChange);
  }

  // ---------- 13. start ----------
  var initial = decodeURIComponent((location.hash || "").slice(1));
  if (initial && document.getElementById(initial)) goTo(initial, false);
  spy();
})();
</script>
</body>
</html>
