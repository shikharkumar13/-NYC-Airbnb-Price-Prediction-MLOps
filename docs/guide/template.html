      <input class="search" id="search" type="search" placeholder="Search headings and files" aria-label="Search headings and files" autocomplete="off">
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch between light and dark">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="toc" id="toc"></div>
    <ol class="results" id="results" hidden></ol>
    <p class="side-foot">Press <kbd>/</kbd> to search. Progress is saved in this browser only.</p>
  </nav>

  <main>
    <article id="article"><p class="loading">Loading the guide…</p></article>
    <noscript><p>This page needs JavaScript to render. The same guide is in <code>airbnb_mlops_guide.md</code>.</p></noscript>
  </main>
</div>

<script type="text/markdown" id="guide-src">
<!--GUIDE_MARKDOWN-->
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
<script>
(function () {
  "use strict";
  var MERMAID_URL = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js";
  var STORE_DONE = "airbnb-guide-done";
  var STORE_THEME = "airbnb-guide-theme";
  var root = document.documentElement;
  var article = document.getElementById("article");

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { return null; }
  }
  function el(tag, cls, html) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html != null) node.innerHTML = html;
    return node;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  // GitHub's heading-anchor rule, so links written for GitHub (#setting-up-on-windows-wsl2) work here too.
  var usedSlugs = {};
  function slugify(text) {
    var base = text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
    var slug = base, n = 1;
    while (usedSlugs[slug]) slug = base + "-" + n++;
    usedSlugs[slug] = true;
    return slug;
  }

  var savedTheme = store(STORE_THEME);
  if (savedTheme === "light" || savedTheme === "dark") root.setAttribute("data-theme", savedTheme);

  if (!window.marked) {
    article.innerHTML = '<p class="loading">The Markdown renderer could not load (are you offline?). Read <code>airbnb_mlops_guide.md</code> instead.</p>';
    return;
  }

  // ---------- 1. render ----------
  var source = document.getElementById("guide-src").textContent
    .replace(/<\\!--/g, "<!--").replace(/<\\\/script/gi, "</script");
  article.innerHTML = marked.parse(source, { gfm: true });

  // ---------- 2. headings: ids, eyebrows, anchors ----------
  var TITLE_SPLIT = /^(Part \d+|Chapter \d+|Appendix [A-Z]):\s+(.*)$/;
  Array.prototype.forEach.call(article.querySelectorAll("h1, h2, h3"), function (h) {
    var text = h.textContent;
    h.id = slugify(text);
    h.setAttribute("data-title", text);
    var m = text.match(TITLE_SPLIT);
    if (m) {
      var label = m[1];
      h.setAttribute("data-label", label);
      h.setAttribute("data-short", m[2]);
      h.innerHTML = '<span class="eyebrow">' + escapeHtml(label) + "</span>" + escapeHtml(m[2]);
    }
    if (h.tagName !== "H1") {
      var a = el("a", "anchor", "#");
      a.href = "#" + h.id;
      a.setAttribute("aria-label", "Link to this section");
      h.appendChild(a);
    }
  });

  // ---------- 3. group into hero / parts / chapters ----------
  var nodes = Array.prototype.slice.call(article.childNodes);
  var frag = document.createDocumentFragment();
  var current = null, partIndex = 0, isFirstH1 = true, hero = null;
  var PART_COUNT = article.querySelectorAll("h1[data-label^='Part']").length;
  nodes.forEach(function (node) {
    if (node.nodeType !== 1) { if (current && node.nodeType === 3) current.appendChild(node); return; }
    if (node.tagName === "HR") return;
    if (node.tagName === "H1") {
      if (isFirstH1) {
        isFirstH1 = false;
        hero = el("section", "hero"); hero.id = "top";
        hero.appendChild(node);
        frag.appendChild(hero);
        current = hero;
        return;
      }
      var part = el("header", "part");
      var label = node.getAttribute("data-label");
      if (label && /^Part/.test(label)) {
        partIndex += 1;
        var strip = el("div", "strip");
        var line = el("div", "strip-line");
        for (var i = 1; i <= PART_COUNT; i++) {
          line.appendChild(el("span", i < partIndex ? "past" : i === partIndex ? "here" : ""));
        }
        strip.appendChild(line);
        strip.appendChild(el("span", null, "Part " + partIndex + " of " + PART_COUNT));
        part.appendChild(strip);
      }
      part.appendChild(node);
      frag.appendChild(part);
      current = null;
      return;
    }
    if (node.tagName === "H2") {
      current = el("section", "chapter");
      current.appendChild(node);
      frag.appendChild(current);
      return;
    }
    if (!current) { current = el("section", "chapter intro"); frag.appendChild(current); }
    current.appendChild(node);
  });
  article.innerHTML = "";
  article.appendChild(frag);

  // hero: turn the "> **Project:** …" block into a label/value list
  if (hero) {
    var quote = hero.querySelector("blockquote");
    if (quote) {
      var dl = el("dl", "meta");
      quote.querySelector("p").innerHTML.split("\n").forEach(function (line) {
        var m = line.match(/^<strong>([^<]+?):?<\/strong>:?\s*(.*)$/);
        if (!m) return;
        dl.appendChild(el("dt", null, m[1].replace(/:$/, "")));
        dl.appendChild(el("dd", null, m[2]));
      });
      quote.replaceWith(dl);
    }
    var route = el("div", "route");
    ["DVC", "MLflow", "FastAPI", "Docker", "Prefect", "Actions", "Compose"].forEach(function (name) {
      route.appendChild(el("span", "bullet", name));
    });
    hero.insertBefore(route, hero.firstChild);
  }

  // ---------- 4. code blocks, diagrams, tables ----------
  function textOf(node) { return node ? node.textContent.trim() : ""; }
  var previousKind = null;
  Array.prototype.forEach.call(article.querySelectorAll("pre > code"), function (code) {
    var pre = code.parentNode;
    var lang = ((code.className.match(/language-([\w-]+)/) || [])[1] || "").toLowerCase();
    if (lang === "mermaid") {
      var fig = el("figure", "diagram");
      var m = el("pre", "mermaid");
      var src = code.textContent.replace(/\\n/g, "<br/>");
      m.textContent = src;
      m.setAttribute("data-src", src);
      fig.appendChild(m);
      pre.replaceWith(fig);
      return;
    }
    var prev = pre.previousElementSibling;
    var prevText = textOf(prev);
    var kind, labelHtml = "";
    if (prev && prev.tagName === "P" && /^(File|Append to): /.test(prevText) && prev.querySelector("strong")) {
      kind = "file";
      var verb = /Append to/.test(prevText) ? "Append to" : "File";
      var path = prev.querySelector("code") ? prev.querySelector("code").textContent : prevText;
      var note = prev.querySelector("em") ? " " + escapeHtml(prev.querySelector("em").textContent) : "";
      labelHtml = '<span class="kind">' + verb + "</span><b>" + escapeHtml(path) + "</b>" + note;
      prev.remove();
    } else if (lang === "bash" || lang === "powershell") {
      kind = "term";
      labelHtml = '<span class="kind">' + (lang === "bash" ? "Terminal" : "PowerShell") + "</span>";
    } else if (!lang || lang === "text") {
      kind = "out";
      if (prev && prev.tagName === "P" && /^Expected/.test(prevText)) {
        labelHtml = '<span class="kind">Expected output</span>';
        if (/^Expected:?$/.test(prevText)) prev.remove();
      } else if (previousKind === "term" && prev && prev.classList && prev.classList.contains("code")) {
        labelHtml = '<span class="kind">Output</span>';
      } else {
        labelHtml = '<span class="kind">Text</span>';
      }
    } else {
      kind = "file";
      labelHtml = '<span class="kind">' + escapeHtml(lang) + "</span>";
    }
    previousKind = kind;

    var box = el("div", "code kind-" + kind);
    var head = el("div", "code-head");
    head.appendChild(el("span", "label", labelHtml));
    if (kind !== "out") {
      var btn = el("button", "copy", "Copy");
      btn.type = "button";
      btn.setAttribute("aria-label", "Copy this code");
      head.appendChild(btn);
    }
    pre.replaceWith(box);
    box.appendChild(head);
    box.appendChild(pre);
    if (lang && window.hljs && hljs.getLanguage(lang)) {
      try { hljs.highlightElement(code); } catch (e) { /* plain text is fine */ }
    }
  });

  Array.prototype.forEach.call(article.querySelectorAll("table"), function (t) {
    var wrap = el("div", "table-wrap");
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });

  // ---------- 5. callouts, exercises, checkpoints ----------
  // Callouts are GitHub alert blockquotes: "> [!TIP]", "> [!WARNING]", "> [!NOTE]".
  var ALERTS = { TIP: ["tip", "Tip"], WARNING: ["warn", "Warning"], NOTE: ["note", "Note"], IMPORTANT: ["warn", "Important"], CAUTION: ["warn", "Caution"] };
  Array.prototype.forEach.call(article.querySelectorAll("blockquote"), function (bq) {
    var first = bq.firstElementChild;
    if (!first || first.tagName !== "P") return;
    var m = first.innerHTML.match(/^\s*\[!(TIP|WARNING|NOTE|IMPORTANT|CAUTION)\]\s*/);
    if (!m) return;
    first.innerHTML = first.innerHTML.slice(m[0].length);
    if (!first.innerHTML.trim()) first.remove();
    var type = ALERTS[m[1]];
    var label = type[1];
    var lead = bq.querySelector("p > strong:first-child");
    if (type[0] === "note" && lead && /^Windows:?$/.test(lead.textContent.trim())) {
      label = "Windows";
      var after = lead.nextSibling;
      lead.remove();
      if (after && after.nodeType === 3) after.textContent = after.textContent.replace(/^\s+/, "");
    }
    var box = el("aside", "callout " + type[0]);
    box.appendChild(el("span", "callout-label", escapeHtml(label)));
    var body = el("div", "callout-body");
    while (bq.firstChild) body.appendChild(bq.firstChild);
    box.appendChild(body);
    bq.replaceWith(box);
  });
  Array.prototype.forEach.call(article.querySelectorAll("section > h3"), function (h) {
    var t = h.getAttribute("data-title") || "";
    var type = /^See it fail:/.test(t) ? "exercise" : /^Checkpoint$/.test(t) ? "checkpoint" : null;
    if (!type) return;
    var box = el("div", "box " + type);
    h.parentNode.insertBefore(box, h);
    var sib = h;
    while (sib && !(sib !== h && /^H[123]$/.test(sib.tagName))) {
      var next = sib.nextElementSibling;
      box.appendChild(sib);
      sib = next;
    }
    var anchor = h.querySelector(".anchor");
    var rest = t.replace(/^See it fail:\s*/, "");
    h.innerHTML = '<span class="tag">' + (type === "exercise" ? "See it fail" : "Checkpoint") + "</span>" +
      (type === "exercise" ? escapeHtml(rest) : "Prove this chapter worked");
    if (anchor) h.appendChild(anchor);
  });

  // links: in-page anchors scroll; others open in a new tab
  Array.prototype.forEach.call(article.querySelectorAll("a[href]"), function (a) {
    if (!/^#/.test(a.getAttribute("href"))) { a.target = "_blank"; a.rel = "noopener"; }
  });

  // ---------- 6. table of contents (the line) ----------
  var toc = document.getElementById("toc");
  var sections = Array.prototype.slice.call(article.querySelectorAll("section.chapter"));
  var chapters = [];
  var lineEl = null;
  function openLine(label) {
    var wrap = el("div", "line");
    wrap.appendChild(el("div", "line-label", escapeHtml(label)));
    lineEl = el("ol", "stations");
    wrap.appendChild(lineEl);
    toc.appendChild(wrap);
  }
  openLine("Start here");
  Array.prototype.forEach.call(article.children, function (block) {
    if (block.classList.contains("part")) {
      var h1 = block.querySelector("h1");
      var label = h1.getAttribute("data-label");
      openLine(label ? label + " · " + h1.getAttribute("data-short") : h1.getAttribute("data-title"));
      return;
    }
    if (!block.classList.contains("chapter")) return;
    var h2 = block.querySelector(":scope > h2");
    if (!h2) return;
    var label2 = h2.getAttribute("data-label");
    var isChapter = /^Chapter/.test(label2 || "");
    var li = el("li", "station");
    var a = el("a");
    a.href = "#" + h2.id;
    a.innerHTML = '<span class="dot" aria-hidden="true"></span><span>' +
      (label2 ? '<span class="ch-no">' + escapeHtml(label2) + "</span>" : "") +
      escapeHtml(h2.getAttribute("data-short") || h2.getAttribute("data-title")) + "</span>";
    li.appendChild(a);
    var subs = el("ol", "subs");
    Array.prototype.forEach.call(block.querySelectorAll("h3"), function (h3) {
      var sa = el("a", null, escapeHtml(h3.getAttribute("data-title")));
      sa.href = "#" + h3.id;
      var sli = el("li"); sli.appendChild(sa); subs.appendChild(sli);
    });
    if (subs.children.length) li.appendChild(subs);
    lineEl.appendChild(li);
    var entry = { section: block, h2: h2, li: li, isChapter: isChapter };
    chapters.push(entry);
  });

  // ---------- 7. chapter completion + next links ----------
  var done = {};
  try { (JSON.parse(store(STORE_DONE) || "[]") || []).forEach(function (id) { done[id] = true; }); } catch (e) { done = {}; }
  var chapterEntries = chapters.filter(function (c) { return c.isChapter; });
  function paintDone() {
    var count = 0;
    chapterEntries.forEach(function (c) {
      var isDone = !!done[c.h2.id];
      if (isDone) count++;
      c.li.classList.toggle("done", isDone);
      if (c.button) {
        c.button.setAttribute("aria-pressed", isDone ? "true" : "false");
        c.button.textContent = isDone ? "Chapter complete" : "Mark " + c.h2.getAttribute("data-label") + " complete";
      }
    });
    document.getElementById("meter-text").textContent = count + " of " + chapterEntries.length + " chapters complete";
    document.getElementById("meter-fill").style.width = (chapterEntries.length ? 100 * count / chapterEntries.length : 0) + "%";
  }
  chapters.forEach(function (c, i) {
    var foot = el("div", "chapter-foot");
    if (c.isChapter) {
      var b = el("button", "done-btn");
      b.type = "button";
      b.addEventListener("click", function () {
        if (done[c.h2.id]) delete done[c.h2.id]; else done[c.h2.id] = true;
        store(STORE_DONE, JSON.stringify(Object.keys(done)));
        paintDone();
      });
      c.button = b;
      foot.appendChild(b);
    }
    var next = chapters[i + 1];
    if (next) {
      var nl = el("a", "next-link");
      nl.href = "#" + next.h2.id;
      nl.innerHTML = "<small>Next</small><span>" +
        escapeHtml((next.h2.getAttribute("data-label") ? next.h2.getAttribute("data-label") + ": " : "") +
        (next.h2.getAttribute("data-short") || next.h2.getAttribute("data-title"))) + " →</span>";
      foot.appendChild(nl);
    }
    if (foot.children.length) c.section.appendChild(foot);
  });
  paintDone();

  // ---------- 8. copy buttons ----------
  article.addEventListener("click", function (e) {
    var btn = e.target.closest(".copy");
    if (!btn) return;
    var code = btn.closest(".code").querySelector("pre code");
    var text = code.textContent.replace(/\n$/, "");
    function ok() {
      btn.textContent = "Copied"; btn.classList.add("done");
      setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
    }
    function fallback() {
      var range = document.createRange();
      range.selectNodeContents(code);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.textContent = "Selected, press ⌘C";
      setTimeout(function () { btn.textContent = "Copy"; }, 2400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  });

  // ---------- 9. navigation: in-page links, drawer ----------
  function closeNav() {
    document.body.classList.remove("nav-open");
    document.getElementById("menu-btn").setAttribute("aria-expanded", "false");
  }
  document.getElementById("menu-btn").addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("scrim").addEventListener("click", closeNav);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeNav(); });
  function goTo(id, smooth) {
    var target = document.getElementById(id);
    if (!target) return;
    target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* hash is optional */ }
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = decodeURIComponent(a.getAttribute("href").slice(1));
    if (!document.getElementById(id)) return;
    e.preventDefault();
    closeNav();
    goTo(id, true);
  });

  // ---------- 10. scroll spy + progress ----------
  var spyHeads = Array.prototype.slice.call(article.querySelectorAll("section.chapter > h2, section.chapter h3"));
  var progress = document.getElementById("progress");
  var topbarTitle = document.getElementById("topbar-title");
  var ticking = false, lastChapter = null, lastSub = null;
  function spy() {
    ticking = false;
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    progress.style.transform = "scaleX(" + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ")";
    var active = null;
    for (var i = 0; i < spyHeads.length; i++) {
      if (spyHeads[i].getBoundingClientRect().top < 140) active = spyHeads[i]; else break;
    }
    var chapter = active ? chapters.filter(function (c) { return c.section.contains(active); })[0] : null;
    if (chapter !== lastChapter) {
      if (lastChapter) lastChapter.li.classList.remove("current");
      if (chapter) {
        chapter.li.classList.add("current");
        topbarTitle.textContent = (chapter.h2.getAttribute("data-label") ? chapter.h2.getAttribute("data-label") + " · " : "") +
          (chapter.h2.getAttribute("data-short") || chapter.h2.getAttribute("data-title"));
        var sidebar = document.getElementById("sidebar");
        var r = chapter.li.getBoundingClientRect();
        if (r.top < 80 || r.bottom > window.innerHeight - 40) {
          sidebar.scrollTop += r.top - window.innerHeight / 3;
        }
      } else {
        topbarTitle.textContent = "MLOps from Scratch";
      }
      lastChapter = chapter;
    }
    var sub = active && active.tagName === "H3" ? toc.querySelector('.subs a[href="#' + active.id + '"]') : null;
    if (sub !== lastSub) {
      if (lastSub) lastSub.classList.remove("current");
      if (sub) sub.classList.add("current");
      lastSub = sub;
    }
  }
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, { passive: true });
  window.addEventListener("resize", spy);

  // ---------- 11. search ----------
  var search = document.getElementById("search");
  var results = document.getElementById("results");
  var index = [];
  Array.prototype.forEach.call(article.querySelectorAll("h2, h3"), function (h) {
    var owner = chapters.filter(function (c) { return c.section.contains(h); })[0];
    index.push({ id: h.id, text: (h.getAttribute("data-title") || ""),
      where: owner && owner.h2 !== h ? (owner.h2.getAttribute("data-label") || owner.h2.getAttribute("data-title")) : "" });
  });
  Array.prototype.forEach.call(article.querySelectorAll(".kind-file .label b"), function (b) {
    var box = b.closest(".code");
    var owner = chapters.filter(function (c) { return c.section.contains(box); })[0];
    if (!box.id) box.id = slugify("file " + b.textContent);
    index.push({ id: box.id, text: b.textContent, where: "File" + (owner && owner.h2.getAttribute("data-label") ? " · " + owner.h2.getAttribute("data-label") : "") });
  });
  var activeResult = 0;
  function runSearch() {
    var q = search.value.trim().toLowerCase();
    if (!q) { results.hidden = true; toc.hidden = false; return; }
    var terms = q.split(/\s+/);
    var hits = index.filter(function (item) {
      var hay = (item.text + " " + item.where).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    }).slice(0, 25);
    results.innerHTML = "";
    if (!hits.length) results.appendChild(el("li", "empty", "No heading or file matches \"" + escapeHtml(search.value.trim()) + "\"."));
    hits.forEach(function (item, i) {
      var li = el("li");
      var a = el("a", i === 0 ? "active" : "", escapeHtml(item.text) + (item.where ? "<small>" + escapeHtml(item.where) + "</small>" : ""));
      a.href = "#" + item.id;
      li.appendChild(a); results.appendChild(li);
    });
    activeResult = 0;
    results.hidden = false; toc.hidden = true;
  }
  search.addEventListener("input", runSearch);
  search.addEventListener("keydown", function (e) {
    var links = results.querySelectorAll("a");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!links.length) return;
      e.preventDefault();
      links[activeResult].classList.remove("active");
      activeResult = (activeResult + (e.key === "ArrowDown" ? 1 : links.length - 1)) % links.length;
      links[activeResult].classList.add("active");
    } else if (e.key === "Enter" && links.length) {
      e.preventDefault();
      links[activeResult].click();
    } else if (e.key === "Escape") {
      search.value = ""; runSearch(); search.blur();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    if (window.matchMedia("(max-width: 960px)").matches) document.body.classList.add("nav-open");
    search.focus();
  });

  // ---------- 12. theme + diagrams ----------
  function isDark() {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.getElementById("theme-btn").addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store(STORE_THEME, next);
  });

  var ownMermaid = false;
  function token(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  function renderDiagrams() {
    var diagrams = article.querySelectorAll("pre.mermaid");
    Array.prototype.forEach.call(diagrams, function (d) {
      d.removeAttribute("data-processed");
      d.textContent = d.getAttribute("data-src");
    });
    window.mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      securityLevel: "strict",
      fontFamily: token("--body"),
      flowchart: { htmlLabels: true, curve: "basis" },
      themeVariables: {
        darkMode: isDark(),
        background: token("--surface"),
        fontSize: "14px",
        primaryColor: token("--accent-soft"),
        primaryBorderColor: token("--accent"),
        primaryTextColor: token("--ink"),
        secondaryColor: token("--ground"),
        tertiaryColor: token("--ground"),
        lineColor: token("--muted"),
        textColor: token("--ink"),
        clusterBkg: token("--ground"),
        clusterBorder: token("--rule"),
        edgeLabelBackground: token("--surface"),
        titleColor: token("--ink"),
        actorBkg: token("--accent-soft"),
        actorBorder: token("--accent"),
        actorTextColor: token("--ink"),
        signalColor: token("--ink-2"),
        signalTextColor: token("--ink"),
        labelBoxBkgColor: token("--ground"),
        labelBoxBorderColor: token("--rule"),
        labelTextColor: token("--ink"),
        loopTextColor: token("--ink"),
        noteBkgColor: token("--warn-bg"),
        noteBorderColor: token("--warn-line"),
        noteTextColor: token("--ink")
      }
    });
    window.mermaid.run({ nodes: diagrams }).catch(function () { /* the source stays visible */ });
  }
  function loadMermaid() {
    var pending = Array.prototype.some.call(article.querySelectorAll("pre.mermaid"), function (d) {
      return !d.querySelector("svg");
    });
    if (!pending) return;
    var s = document.createElement("script");
    s.src = MERMAID_URL;
    s.onload = function () { ownMermaid = true; renderDiagrams(); };
    document.head.appendChild(s);
  }
  // Some hosts render mermaid themselves; only load the library if nothing drew the diagrams.
  setTimeout(loadMermaid, 900);
  function onThemeChange() { if (ownMermaid) renderDiagrams(); }
  new MutationObserver(onThemeChange).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", onThemeChange);
  }

  // ---------- 13. start ----------
  var initial = decodeURIComponent((location.hash || "").slice(1));
  if (initial && document.getElementById(initial)) goTo(initial, false);
  spy();
})();
</script>
</body>
